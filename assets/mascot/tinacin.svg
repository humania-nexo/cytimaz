<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%">
  <defs>
    <!-- Tank Body Gradients -->
    <linearGradient id="tinacoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="eyeShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="160" cy="335" rx="85" ry="14" fill="#0F172A" opacity="0.15" />

  <g filter="url(#mascotShadow)">
    <!-- Waving Left Arm (Character's Right) -->
    <g transform="translate(60, 160)">
      <path d="M 10 10 Q -25 -15 -30 -40 Q -20 -48 -5 -30 Q 15 -10 20 15 Z" fill="#0284C7" stroke="#0369A1" stroke-width="3"/>
      <!-- Glove / Hand with thumb up -->
      <circle cx="-28" cy="-38" r="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
      <circle cx="-36" cy="-44" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    </g>

    <!-- Resting Right Arm (Character's Left) -->
    <g transform="translate(240, 195)">
      <path d="M -10 -5 Q 25 10 32 30 Q 20 40 5 25 Z" fill="#0284C7" stroke="#0369A1" stroke-width="3"/>
      <!-- Hand on hip -->
      <circle cx="30" cy="32" r="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    </g>

    <!-- Main Tinaco Body (Rotomolded Conical Shape) -->
    <path d="M 85 95 C 120 78 200 78 235 95 L 252 280 C 200 305 120 305 68 280 Z" fill="url(#tinacoBody)" stroke="#0F172A" stroke-width="4"/>

    <!-- Reinforcement Ribs (Characteristic of Cytimaz Tanks) -->
    <path d="M 80 155 Q 160 172 240 155" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 74 215 Q 160 234 246 215" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Tank Top Neck & Lid (Hat) -->
    <rect x="110" y="65" width="100" height="22" rx="6" fill="#0369A1" stroke="#0F172A" stroke-width="3.5"/>
    <ellipse cx="160" cy="65" rx="68" ry="18" fill="url(#lidGrad)" stroke="#0F172A" stroke-width="4"/>
    <!-- Lid Handle Knob -->
    <ellipse cx="160" cy="54" rx="20" ry="7" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>

    <!-- Cute Eyes -->
    <!-- Left Eye -->
    <g transform="translate(118, 120)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
      <ellipse cx="3" cy="2" rx="10" ry="14" fill="#0F172A"/>
      <circle cx="6" cy="-4" r="5" fill="#FFFFFF"/>
      <circle cx="1" cy="6" r="2" fill="#FFFFFF"/>
      <!-- Cheek Blush -->
      <ellipse cx="-12" cy="18" rx="9" ry="5" fill="#F43F5E" opacity="0.4"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(202, 120)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
      <ellipse cx="-3" cy="2" rx="10" ry="14" fill="#0F172A"/>
      <circle cx="0" cy="-4" r="5" fill="#FFFFFF"/>
      <circle cx="-5" cy="6" r="2" fill="#FFFFFF"/>
      <!-- Cheek Blush -->
      <ellipse cx="12" cy="18" rx="9" ry="5" fill="#F43F5E" opacity="0.4"/>
    </g>

    <!-- Cute Big Smile with Tongue -->
    <g transform="translate(160, 158)">
      <path d="M -26 0 Q 0 32 26 0 Z" fill="#0F172A"/>
      <!-- Tongue -->
      <path d="M -12 14 Q 0 10 12 14 Q 0 28 -12 14 Z" fill="#F43F5E"/>
    </g>

    <!-- Little Feet / Base supports -->
    <ellipse cx="115" cy="290" rx="22" ry="10" fill="#0F172A"/>
    <ellipse cx="205" cy="290" rx="22" ry="10" fill="#0F172A"/>

    <!-- Badge on Chest: Water Drop with Mazatlán Sun Sparkle -->
    <g transform="translate(160, 202)">
      <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
      <!-- Water Drop -->
      <path d="M 0 -10 C 0 -10 -8 0 -8 6 C -8 10.5 -4.5 14 0 14 C 4.5 14 8 10.5 8 6 C 8 0 0 -10 0 -10 Z" fill="#0284C7"/>
      <!-- Sparkle -->
      <circle cx="-2" cy="4" r="2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
