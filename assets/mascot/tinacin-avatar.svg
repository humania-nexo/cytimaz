<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="avatarTank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#avatarBg)" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Mascot Head/Body inside circle -->
  <g transform="translate(60, 64) scale(0.48)">
    <!-- Tank Body -->
    <path d="M -75 -45 C -40 -60 40 -60 75 -45 L 85 90 C 40 108 -40 108 -85 90 Z" fill="url(#avatarTank)" stroke="#FFFFFF" stroke-width="6"/>

    <!-- Ribs -->
    <path d="M -72 0 Q 0 14 72 0" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

    <!-- Tank Top Lid (Cap) -->
    <ellipse cx="0" cy="-60" rx="58" ry="16" fill="#60A5FA" stroke="#FFFFFF" stroke-width="7"/>
    <ellipse cx="0" cy="-68" rx="18" ry="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Left Eye -->
    <g transform="translate(-32, -10)">
      <ellipse cx="0" cy="0" rx="14" ry="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      <ellipse cx="2" cy="2" rx="9" ry="12" fill="#0F172A"/>
      <circle cx="4" cy="-3" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(32, -10)">
      <ellipse cx="0" cy="0" rx="14" ry="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      <ellipse cx="-2" cy="2" rx="9" ry="12" fill="#0F172A"/>
      <circle cx="0" cy="-3" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Smile -->
    <path d="M -22 22 Q 0 46 22 22 Z" fill="#0F172A"/>
    <path d="M -10 32 Q 0 30 10 32 Q 0 44 -10 32 Z" fill="#F43F5E"/>
  </g>
</svg>
